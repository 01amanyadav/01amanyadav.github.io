<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman Yadav | Portfolio Links</title>
    <!-- Google Fonts: Inter & Poppins for ultra-bold modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #ff003c;
            --tertiary: #7000ff;
            --bg: #050505;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            cursor: none; /* Custom cursor */
        }

        /* Canvas Background */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Hardware Accelerated Smooth Cursor */
        .cursor {
            position: fixed;
            top: 0; left: 0;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary);
            transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1), height 0.3s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s;
            will-change: transform;
        }
        .cursor-trail {
            position: fixed;
            top: 0; left: 0;
            width: 45px;
            height: 45px;
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            will-change: transform;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 700px;
            padding: 2rem;
            animation: floatUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(50px);
        }

        /* Massive Glitch Name Effect */
        .name-title {
            font-size: 5.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            line-height: 1.1;
            text-align: center;
        }
        
        .name-title::before, .name-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .name-title::before {
            color: var(--primary);
            z-index: -1;
            transform: translateX(-4px);
            animation: glitch 2s infinite cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }

        .name-title::after {
            color: var(--secondary);
            z-index: -2;
            transform: translateX(4px);
            animation: glitch 2.5s infinite cubic-bezier(0.25, 0.46, 0.45, 0.94) reverse both;
        }

        /* Glowing Skills Section */
        .skills-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .skill-tag:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--primary);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
            transform: translateY(-5px) scale(1.05);
            color: var(--primary);
        }

        /* Links Container */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            width: 100%;
        }

        /* Thicker, Bolder 3D Glassmorphic Cards */
        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 1.5rem 2rem;
            width: 100%;
            text-decoration: none;
            color: #fff;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 3px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            /* Transform is purposely removed from transition here to prevent mousemove stutter */
            transition: box-shadow 0.4s ease, border-color 0.4s ease, background 0.4s ease;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Specific Brand Colors & Glows */
        .github:hover { border-color: #fff; box-shadow: 0 10px 30px rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); }
        .linkedin:hover { border-color: #0077b5; box-shadow: 0 10px 30px rgba(0, 119, 181, 0.5); background: rgba(0, 119, 181, 0.1); }
        .instagram:hover { border-color: #e1306c; box-shadow: 0 10px 30px rgba(225, 48, 108, 0.5); background: rgba(225, 48, 108, 0.1); }

        .link-card:hover::before { left: 100%; }
        
        .link-card i {
            font-size: 2.2rem;
            transform: translateZ(40px); /* Pushes icon out in 3D further */
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .link-card span {
            transform: translateZ(25px); /* Pushes text out in 3D */
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Animations */
        @keyframes floatUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glitch {
            0% { clip-path: inset(10% 0 30% 0); }
            20% { clip-path: inset(80% 0 5% 0); }
            40% { clip-path: inset(30% 0 50% 0); }
            60% { clip-path: inset(15% 0 80% 0); }
            80% { clip-path: inset(50% 0 10% 0); }
            100% { clip-path: inset(5% 0 70% 0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .name-title { font-size: 3.5rem; }
            .skill-tag { font-size: 0.9rem; padding: 8px 16px; }
            .link-card { padding: 1.2rem; font-size: 1.2rem; }
            .link-card i { font-size: 1.6rem; }
            body { cursor: auto; } 
            .cursor, .cursor-trail { display: none; }
        }
    </style>
</head>
<body>

    <!-- Particle Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Smooth Hardware Accelerated Cursor -->
    <div class="cursor" id="cursor"></div>
    <div class="cursor-trail" id="cursor-trail"></div>

    <div class="container">
        <!-- Glitch Text -->
        <h1 class="name-title" data-text="Aman Yadav">Aman Yadav</h1>
        
        <!-- Skills Section -->
        <div class="skills-container">
            <span class="skill-tag">DSA (C++)</span>
            <span class="skill-tag">App Dev</span>
            <span class="skill-tag">System Design</span>
        </div>

        <div class="links-wrapper">
            <!-- GitHub -->
            <a href="https://github.com/01amanyadav" target="_blank" class="link-card github">
                <i class="fab fa-github"></i>
                <span>GITHUB</span>
            </a>
            
            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/08amanyadav/" target="_blank" class="link-card linkedin">
                <i class="fab fa-linkedin"></i>
                <span>LINKEDIN</span>
            </a>
            
            <!-- Instagram -->
            <a href="https://instagram.com/1_amanyadav" target="_blank" class="link-card instagram">
                <i class="fab fa-instagram"></i>
                <span>INSTAGRAM</span>
            </a>
        </div>
    </div>

    <script>
        // --- Ultra-Smooth Cursor using Lerp & requestAnimationFrame ---
        const cursor = document.getElementById('cursor');
        const trail = document.getElementById('cursor-trail');
        const cards = document.querySelectorAll('.link-card');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let trailX = mouseX;
        let trailY = mouseY;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function renderCursor() {
            // Main dot follows instantly
            cursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
            
            // Trail follows with Linear Interpolation (Lerp) for buttery smoothness
            trailX += (mouseX - trailX) * 0.15;
            trailY += (mouseY - trailY) * 0.15;
            trail.style.transform = `translate3d(${trailX}px, ${trailY}px, 0) translate(-50%, -50%)`;

            requestAnimationFrame(renderCursor);
        }
        renderCursor();

        // --- Smooth 3D Hover Physics ---
        cards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                // Remove CSS transition for transform when mouse enters so JS can take over instantly
                card.style.transition = 'box-shadow 0.4s ease, border-color 0.4s ease, background 0.4s ease';
                cursor.style.width = '24px';
                cursor.style.height = '24px';
                cursor.style.background = 'transparent';
                cursor.style.border = '2px solid var(--primary)';
            });

            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                // Calculate rotation based on mouse position (Smoothed)
                const rotateX = ((y - centerY) / centerY) * -15; 
                const rotateY = ((x - centerX) / centerX) * 15;

                card.style.transform = `perspective(1000px) scale(1.05) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            card.addEventListener('mouseleave', () => {
                // Restore the CSS transition for a smooth float back to origin
                card.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease, border-color 0.4s ease, background 0.4s ease';
                card.style.transform = `perspective(1000px) scale(1) rotateX(0deg) rotateY(0deg)`;
                
                // Reset Cursor
                cursor.style.width = '8px';
                cursor.style.height = '8px';
                cursor.style.background = 'var(--primary)';
                cursor.style.border = 'none';
            });
        });

        // --- Fluid Particle Network Background ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const particleCount = 90; // Density
        let mouse = { x: null, y: null, radius: 180 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.5 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 20) + 5;
                const colors = ['#00f0ff', '#ff003c', '#7000ff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                // Repel effect from cursor
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;

                    if (distance < mouse.radius) {
                        this.x -= directionX;
                        this.y -= directionY;
                    } else {
                        if (this.x !== this.baseX) this.x -= (this.x - this.baseX) / 20;
                        if (this.y !== this.baseY) this.y -= (this.y - this.baseY) / 20;
                    }
                } else {
                    if (this.x !== this.baseX) this.x -= (this.x - this.baseX) / 20;
                    if (this.y !== this.baseY) this.y -= (this.y - this.baseY) / 20;
                }
                
                // Ambient drifting
                this.baseX += (Math.random() - 0.5) * 0.4;
                this.baseY += (Math.random() - 0.5) * 0.4;

                this.draw();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Connect lines
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 110) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 240, 255, ${0.8 - distance/110})`;
                        ctx.lineWidth = 0.8;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
